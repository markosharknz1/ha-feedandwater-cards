# ============================================================================
# HELPERS — Display Tank
# Generated from templates/helpers.yaml.tmpl — do not hand-edit if you plan
# to regenerate later; edit the template instead.
# ============================================================================

input_select:
  display_flow_mode:
    name: "Display Tank Flow Mode"
    icon: mdi:waves
    options:
      - "Reef Crest"
      - "Nutrient Export"
      - "Feed"

input_boolean:
  display_feed_mode:
    name: "Display Tank Feed Mode"
    icon: mdi:food-drumstick

  display_water_change_mode:
    name: "Display Tank Water Change Mode"
    icon: mdi:water-sync

input_number:
  display_feed_duration_minutes:
    name: "Display Tank Feed Mode Duration"
    icon: mdi:timer-outline
    mode: slider
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    initial: 20

  display_feed_return_pump_percent:
    name: "Display Tank Return Pump Feed Speed"
    icon: mdi:speedometer-slow
    mode: slider
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 30

  display_feed_skimmer_extra_minutes:
    name: "Display Tank Skimmer Extra Off Time (after feed ends)"
    icon: mdi:timer-plus-outline
    mode: slider
    min: 0
    max: 30
    step: 1
    unit_of_measurement: min
    initial: 10

  display_water_change_volume_liters:
    name: "Display Tank Last Water Change Volume"
    icon: mdi:cup-water
    min: 0
    max: 500
    step: 1
    unit_of_measurement: L

  display_wc_wavemaker_delay:
    name: "Display Tank Return Pump \u2192 Wavemaker Delay"
    icon: mdi:timer-sand
    mode: slider
    min: 0
    max: 30
    step: 1
    unit_of_measurement: min
    initial: 5

  display_wc_skimmer_delay:
    name: "Display Tank Wavemaker \u2192 Skimmer Delay"
    icon: mdi:timer-sand
    mode: slider
    min: 0
    max: 30
    step: 1
    unit_of_measurement: min
    initial: 10

input_datetime:
  display_last_water_change:
    name: "Display Tank Last Water Change"
    has_date: true
    has_time: true

input_text:
  display_tracked_devices:
    name: "Display Tank Tracked Devices (comma-separated entity_ids)"
    icon: mdi:format-list-bulleted
    max: 255
    initial: ""

  display_feed_return_pump_prior:
    name: "Display Tank Return Pump Speed Before Feed (internal storage)"
    icon: mdi:content-save-outline
    max: 255
    initial: ""

timer:
  display_feed_mode:
    name: "Display Tank Feed Mode Timer (wavemakers)"
    duration: "00:20:00"

  display_feed_skimmer_off:
    name: "Display Tank Feed Mode Timer (skimmer)"
    duration: "00:30:00"

  display_skimmer_restart_delay:
    name: "Display Tank Skimmer Restart Delay"
    duration: "00:05:00"

  display_water_change_safety:
    name: "Display Tank Water Change Safety Timer"
    duration: "02:00:00"

  display_wc_wavemaker_countdown:
    name: "Display Tank Wavemaker Restart Countdown"
    duration: "00:05:00"

  display_wc_skimmer_countdown:
    name: "Display Tank Skimmer Restart Countdown"
    duration: "00:10:00"
