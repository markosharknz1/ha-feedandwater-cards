type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    primary: "Display Tank"
    secondary: >
      {% if is_state('input_boolean.display_water_change_mode', 'on') %}
        Paused — tap Resume when done
      {% elif is_state('timer.display_wc_wavemaker_countdown', 'active') %}
        Resuming — wavemakers restart {{ relative_time(as_datetime(state_attr('timer.display_wc_wavemaker_countdown','finishes_at'))) }}
      {% elif is_state('timer.display_wc_skimmer_countdown', 'active') %}
        Resuming — skimmer restarts {{ relative_time(as_datetime(state_attr('timer.display_wc_skimmer_countdown','finishes_at'))) }}
      {% else %}
        Idle
      {% endif %}
    icon: mdi:water-sync
    icon_color: >
      {% if is_state('input_boolean.display_water_change_mode', 'on') %}blue
      {% elif is_state('timer.display_wc_wavemaker_countdown', 'active') or is_state('timer.display_wc_skimmer_countdown', 'active') %}orange
      {% else %}green{% endif %}

  - type: custom:mushroom-chips-card
    alignment: start
    chips:
      # Idle: offer to start
      - type: conditional
        conditions:
          - entity: input_boolean.display_water_change_mode
            state: "off"
          - entity: timer.display_wc_wavemaker_countdown
            state: ["idle", "paused"]
          - entity: timer.display_wc_skimmer_countdown
            state: ["idle", "paused"]
        chip:
          type: template
          icon: mdi:water-sync
          icon_color: green
          content: Start Water Change
          tap_action:
            action: call-service
            service: input_boolean.turn_on
            target:
              entity_id: input_boolean.display_water_change_mode

      # Paused: offer to resume (triggers the staged restart)
      - type: conditional
        conditions:
          - entity: input_boolean.display_water_change_mode
            state: "on"
        chip:
          type: template
          icon: mdi:play-circle-outline
          icon_color: blue
          content: Resume
          tap_action:
            action: call-service
            service: input_boolean.turn_off
            target:
              entity_id: input_boolean.display_water_change_mode

# No chip while the staged restart itself is running — nothing to tap,
# the status line above already reports progress. Wavemaker/skimmer
# restart delays, last-change log, and volume live in
# water_change_settings_card_mushroom.yaml.
