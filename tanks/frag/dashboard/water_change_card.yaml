type: vertical-stack
cards:
  - type: entities
    title: "Frag Tank — Water Change"
    show_header_toggle: false
    entities:
      - entity: input_boolean.frag_water_change_mode
        name: Water Change Time
        icon: mdi:water-sync

      - type: divider

      - entity: input_number.frag_wc_wavemaker_delay
        name: Wavemaker Restart Delay

      - entity: input_number.frag_wc_skimmer_delay
        name: Skimmer Restart Delay

      - type: divider

      - entity: timer.frag_wc_wavemaker_countdown
        name: Wavemaker Restarts In

      - entity: timer.frag_wc_skimmer_countdown
        name: Skimmer Restarts In

      - type: divider

      - entity: input_datetime.frag_last_water_change
        name: Last Water Change

      - entity: input_number.frag_water_change_volume_liters
        name: Last Volume (L)

  # Stage indicator — shows plain text for whichever stage is active
  - type: markdown
    content: >
      {% if is_state('input_boolean.frag_water_change_mode', 'on') %}
      🔵 **Water change in progress** — return pump, wavemakers, and skimmer are paused. Tap "Water Change Time" off when you're done.
      {% elif is_state('timer.frag_wc_wavemaker_countdown', 'active') %}
      🟡 **Return pump restarted** — wavemakers restart in {{ relative_time(as_datetime(state_attr('timer.frag_wc_wavemaker_countdown','finishes_at'))) }}
      {% elif is_state('timer.frag_wc_skimmer_countdown', 'active') %}
      🟠 **Wavemakers restarted** — skimmer restarts in {{ relative_time(as_datetime(state_attr('timer.frag_wc_skimmer_countdown','finishes_at'))) }}
      {% else %}
      🟢 **All equipment running normally**
      {% endif %}

  # Needs script.frag_log_water_change — see log_water_change_script.yaml.tmpl
  - type: button
    name: Log Water Change Now
    icon: mdi:calendar-check
    tap_action:
      action: call-service
      service: script.frag_log_water_change
