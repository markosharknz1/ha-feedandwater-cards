type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: "Main Display Tank — Water Change"
    subtitle: Staged pause & restart

  - type: custom:mushroom-entity-card
    entity: input_boolean.reef_water_change_mode
    name: Water Change Time
    icon: mdi:water-sync
    icon_color: >
      {% if is_state('input_boolean.reef_water_change_mode', 'on') %}blue{% else %}grey{% endif %}
    tap_action:
      action: toggle

  - type: custom:mushroom-template-card
    primary: >
      {% if is_state('input_boolean.reef_water_change_mode', 'on') %}
        Paused — return pump, wavemakers, skimmer all off
      {% elif is_state('timer.reef_wc_wavemaker_countdown', 'active') %}
        Wavemakers restart {{ relative_time(as_datetime(state_attr('timer.reef_wc_wavemaker_countdown','finishes_at'))) }}
      {% elif is_state('timer.reef_wc_skimmer_countdown', 'active') %}
        Skimmer restarts {{ relative_time(as_datetime(state_attr('timer.reef_wc_skimmer_countdown','finishes_at'))) }}
      {% else %}
        All equipment running normally
      {% endif %}
    secondary: >
      {% if is_state('input_boolean.reef_water_change_mode', 'off')
         and not is_state('timer.reef_wc_wavemaker_countdown', 'active')
         and not is_state('timer.reef_wc_skimmer_countdown', 'active') %}
        Last change: {{ relative_time(states.input_datetime.reef_last_water_change.last_changed) }}
      {% else %}
        Staged restart in progress
      {% endif %}
    icon: mdi:cup-water
    icon_color: >
      {% if is_state('input_boolean.reef_water_change_mode', 'on') %}blue
      {% elif is_state('timer.reef_wc_wavemaker_countdown', 'active') or is_state('timer.reef_wc_skimmer_countdown', 'active') %}orange
      {% else %}green{% endif %}

  - type: custom:mushroom-number-card
    entity: input_number.reef_wc_wavemaker_delay
    name: Wavemaker Restart Delay
    display_mode: slider
    icon: mdi:timer-sand

  - type: custom:mushroom-number-card
    entity: input_number.reef_wc_skimmer_delay
    name: Skimmer Restart Delay
    display_mode: slider
    icon: mdi:timer-sand

  - type: custom:mushroom-number-card
    entity: input_number.reef_water_change_volume_liters
    name: Volume This Change (L)
    display_mode: buttons

  # Needs script.reef_log_water_change — see log_water_change_script.yaml.tmpl
  - type: custom:mushroom-template-card
    primary: Log Water Change Now
    icon: mdi:calendar-check
    tap_action:
      action: call-service
      service: script.reef_log_water_change
